<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Cãobeleleiro'">Cãobeleleiro</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="nav">
    <a class="marca" th:href="@{/}"><img th:src="@{/img/logoenome.png}" alt="Cãobeleleiro"></a>
    <nav>
        <a th:href="@{/agenda}" th:classappend="${secao == 'agenda'} ? 'ativo'">Agenda</a>
        <a th:href="@{/app/clientes}" th:classappend="${secao == 'clientes'} ? 'ativo'">Clientes</a>
        <a th:href="@{/app/cachorros}" th:classappend="${secao == 'cachorros'} ? 'ativo'">Cachorros</a>
    </nav>
    <form method="post" th:action="@{/logout}">
        <button type="submit" class="link">Sair</button>
    </form>
</header>
<div th:fragment="avisos">
    <p class="ok" th:if="${ok}" th:text="${ok}" role="status"></p>
    <p class="erro" th:if="${erro}" th:text="${erro}" role="alert"></p>
</div>
</body>
</html>
